name: Deploy Caddy

on:
  push:
    branches: [main]
    paths:
      - 'Caddyfile'
  workflow_dispatch: # Дозволяє запустити вручну

jobs:
  deploy-caddy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Caddy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /root/lugabus-list
            git pull origin main
            
            # Оновлюємо лише контейнер Caddy (без запуску залежностей, оскільки проект на холді)
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps caddy
            
            # Форматування Caddyfile та м'яке перезавантаження конфігурації
            docker compose exec -T caddy caddy fmt --overwrite /etc/caddy/Caddyfile
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
